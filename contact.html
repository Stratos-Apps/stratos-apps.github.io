<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Stratos Apps</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="logo.png" alt="">
            <span>Stratos Apps</span>
        </a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="about.html">About</a>
            <a href="https://github.com/stratos-apps"
               target="_blank"
               rel="noopener noreferrer">GitHub</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="container">
        <p class="eyebrow">Get in touch</p>
        <h1>Contact</h1>
        <p class="intro">Reach the Stratos Apps project by email or on social platforms.</p>

        <div class="contact-list">
            <a class="contact-card" href="mailto:stratosapps@duck.com">
                <span class="contact-icon" aria-hidden="true">
                    <!-- Envelope icon -->
                    <svg viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="5" width="18" height="14" rx="2"
                              stroke="currentColor" stroke-width="1.8"/>
                        <path d="m4 7 8 6 8-6"
                              stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="contact-copy">
                    <span class="contact-label">Email</span>
                    <span class="contact-value">stratosapps@duck.com</span>
                </span>
                <span class="contact-arrow" aria-hidden="true">↗</span>
            </a>

            <a class="contact-card"
               href="https://matrix.to/#/#stratos-apps:matrix.org"
               target="_blank"
               rel="noopener noreferrer">
                <span class="contact-icon" aria-hidden="true">
                    <!-- Matrix icon -->
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M4 4h3v2H6v12h1v2H4V4Zm13 0h3v16h-3v-2h1V6h-1V4Z"
                              fill="currentColor"/>
                        <path d="M8 9h2v1.2c.4-.8 1-1.3 2-1.3s1.6.5 1.9 1.3c.4-.8 1.1-1.3 2.1-1.3 1.5 0 2.4 1 2.4 2.7V16h-2.2v-4c0-.8-.3-1.2-.9-1.2s-1 .5-1 1.3V16h-2.2v-4c0-.8-.3-1.2-.9-1.2s-1 .5-1 1.3V16H8V9Z"
                              fill="currentColor"/>
                    </svg>
                </span>
                <span class="contact-copy">
                    <span class="contact-label">Matrix room</span>
                    <span class="contact-value">#stratos-apps:matrix.org</span>
                </span>
                <span class="contact-arrow" aria-hidden="true">↗</span>
            </a>

            <a class="contact-card"
               href="https://mastodon.social/@stratosapps"
               target="_blank"
               rel="noopener noreferrer">
                <span class="contact-icon" aria-hidden="true">
                    <!-- Mastodon icon -->
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 3c-4.3 0-7.8.5-8.5 5.2-.3 2.1-.3 4.7.1 6.8.6 3.4 3 4.4 6.1 4.7 1.5.1 2.9 0 4.2-.4l-.1-2.1c-1.2.3-2.4.4-3.6.3-1.9-.1-3.4-.6-3.7-2.6 2.3.6 4.7.8 7.1.5 3.4-.4 4.9-2.2 5.3-5.7.1-1.1.1-2.6-.1-3.7C18.1 3.5 16 3 12 3Z"
                              fill="currentColor"/>
                        <path d="M8.3 8.2v5.1h2V9.8c0-.7.3-1.1.9-1.1s.9.4.9 1.1v2h2v-2c0-.7.3-1.1.9-1.1s.9.4.9 1.1v3.5h2V8.2h-2v.7c-.5-.6-1.1-.9-1.9-.9s-1.5.4-1.9 1.1c-.4-.7-1.1-1.1-1.9-1.1-.8 0-1.4.3-1.9.9v-.7h-2Z"
                              fill="var(--header)"/>
                    </svg>
                </span>
                <span class="contact-copy">
                    <span class="contact-label">Mastodon</span>
                    <span class="contact-value">@stratosapps@mastodon.social</span>
                </span>
                <span class="contact-arrow" aria-hidden="true">↗</span>
            </a>
        </div>
    </main>
</body>
</html>
